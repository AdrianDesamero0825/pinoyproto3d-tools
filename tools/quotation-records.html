<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PinoyProto 3D - Saved Quotations</title>
  <style>
    :root { --ink:#edf2f7; --muted:#9eacbd; --panel:#151d27; --line:#2b3a4b; --orange:#ff7200; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 85% 4%,rgba(255,114,0,.13),transparent 28rem),#0d141c; font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .app { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }
    nav { position:sticky; top:0; display:flex; height:100vh; min-height:100vh; flex-direction:column; padding:28px 16px; border-right:1px solid var(--line); background:rgba(17,26,36,.86); }
    .brand { margin:0 8px 28px; color:var(--orange); font-size:13px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    .back { display:inline-block; margin:0 8px 24px; color:var(--muted); font-weight:700; text-decoration:none; }
    .back:hover,.back:focus-visible { color:var(--orange); }
    .nav-label { margin:0 8px 9px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .tool-link { display:block; padding:12px; border:1px solid transparent; border-radius:10px; color:var(--ink); text-decoration:none; line-height:1.35; transition:.2s ease; }
    .tool-link:hover,.tool-link:focus-visible,.tool-link.active { border-color:rgba(255,114,0,.45); background:rgba(255,114,0,.12); outline:none; transform:translateX(2px); }
    .saved-link { margin-top:auto; padding-top:18px; border-top:1px solid var(--line); }
    main { width:min(100%,1100px); margin:0 auto; padding:clamp(24px,5vw,58px); }
    h1 { margin:0 0 8px; font-size:clamp(30px,5vw,46px); letter-spacing:-.05em; }
    .intro { margin:0 0 26px; color:var(--muted); }
    .toolbar { margin-bottom:18px; }
    .admin-panel { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; padding:14px; border:1px solid var(--line); border-radius:12px; background:rgba(21,29,39,.86); }
    .admin-panel h2 { flex:1 0 100%; margin:0; font-size:14px; }
    .admin-panel form { display:flex; flex:1 1 100%; flex-wrap:wrap; gap:10px; }
    .admin-panel input { flex:1 1 180px; }
    .admin-button { padding:11px 14px; border:0; border-radius:8px; color:#fff; background:var(--orange); font:inherit; font-weight:800; cursor:pointer; }
    .admin-button.secondary { background:#2a3848; }
    .admin-button.danger { background:#9f3434; }
    .admin-button:hover:not(:disabled) { filter:brightness(1.15); }
    .admin-button:disabled { opacity:.5; cursor:not-allowed; }
    .admin-user { color:#8ee0a4; font-size:12px; }
    input { width:100%; padding:11px 12px; border:1px solid #516276; border-radius:8px; color:var(--ink); background:#111a24; font:inherit; }
    input:focus { border-color:var(--orange); outline:2px solid rgba(255,114,0,.2); }
    .status { min-height:22px; margin:0 0 12px; color:var(--muted); }
    .status.error { color:#ff9a9a; }
    .records { display:grid; gap:12px; }
    .record { border:1px solid var(--line); border-radius:14px; background:rgba(21,29,39,.86); overflow:hidden; }
    .record summary { display:grid; grid-template-columns:1.1fr 1.6fr 1fr auto; gap:16px; align-items:center; padding:16px; cursor:pointer; list-style:none; }
    .record summary::-webkit-details-marker { display:none; }
    .record summary:hover { background:rgba(255,114,0,.08); }
    .record-number { color:#ffb37a; font-weight:900; }
    .record-date { color:var(--muted); font-size:12px; }
    .record-total { text-align:right; font-weight:800; }
    .record-body { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; padding:0 16px 18px; border-top:1px solid var(--line); }
    .record-body h2 { margin:16px 0 6px; font-size:13px; color:#ffb37a; }
    .record-body p { margin:4px 0; color:var(--muted); white-space:pre-wrap; }
    .record-body strong { color:var(--ink); }
    .record-actions { display:flex; flex-wrap:wrap; gap:8px; grid-column:1/-1; }
    .pdf-button { padding:9px 12px; border:0; border-radius:8px; color:#fff; background:var(--orange); font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
    .pdf-button:hover { filter:brightness(1.15); }
    .edit-form { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; grid-column:1/-1; padding:12px; border:1px solid var(--line); border-radius:10px; background:#111a24; }
    .edit-form label { display:grid; gap:4px; color:var(--muted); font-size:11px; font-weight:700; }
    .edit-form input { width:100%; padding:8px; }
    .items { grid-column:1/-1; width:100%; border-collapse:collapse; font-size:12px; }
    .items th,.items td { padding:7px; border-bottom:1px solid var(--line); text-align:left; }
    .items th { color:var(--muted); }
    .empty { padding:26px; border:1px dashed var(--line); border-radius:14px; color:var(--muted); text-align:center; }
    @media (max-width:700px) {
      .app { display:block; }
      nav { position:static; display:flex; height:auto; min-height:0; align-items:center; gap:8px; padding:14px 16px; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; }
      .brand { flex:0 0 auto; margin:0 8px 0 0; }
      .nav-label { display:none; }
      .tool-link { flex:0 0 auto; padding:10px 12px; white-space:nowrap; }
      .saved-link { margin-top:0; padding-top:10px; border-top:0; }
      main { padding:34px 18px; }
      .record summary { grid-template-columns:1fr auto; gap:5px 12px; }
      .record-date,.record-total { text-align:left; }
      .record-body { grid-template-columns:1fr; }
      .edit-form { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav aria-label="Tool navigation">
      <p class="brand">PinoyProto 3D</p>
      <a class="back" href="../index.html">← Return to home</a>
      <p class="nav-label">Tools</p>
      <a class="tool-link" href="customer-feedback.html">Customer Feedback Renderer</a>
      <a class="tool-link" href="quotation-maker.html">Quotation Maker</a>
      <a class="tool-link active saved-link" href="quotation-records.html">Saved Quotations</a>
    </nav>
    <main>
      <h1>Saved quotations</h1>
      <p class="intro">Quotation information saved in your Supabase database.</p>
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search project, customer, or quotation number" aria-label="Search saved quotations">
      </div>
      <section class="admin-panel" aria-label="Admin login">
        <h2>Admin access</h2>
        <form id="loginForm">
          <input id="emailInput" type="email" placeholder="Admin email" aria-label="Admin email" required>
          <input id="passwordInput" type="password" placeholder="Password" aria-label="Admin password" required>
          <button class="admin-button" type="submit">Log in</button>
        </form>
        <span class="admin-user" id="adminUser" hidden></span>
        <button class="admin-button secondary" id="logoutButton" type="button" hidden>Log out</button>
        <button class="admin-button danger" id="clearAllButton" type="button" hidden>Clear all quotations</button>
      </section>
      <p class="status" id="status" aria-live="polite">Loading saved quotations…</p>
      <section class="records" id="records" aria-label="Saved quotations"></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const supabaseClient = window.supabase.createClient("https://cifxwhhdkmecgomwesnk.supabase.co", "sb_publishable_4-at96mA3nKEH6t2irolAg_20waHMZo");
    const recordsElement = document.getElementById("records");
    const statusElement = document.getElementById("status");
    const searchInput = document.getElementById("searchInput");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const adminUser = document.getElementById("adminUser");
    const logoutButton = document.getElementById("logoutButton");
    const clearAllButton = document.getElementById("clearAllButton");
    let records = [];
    let session = null;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[character]));
    }
    function money(value) {
      return Number(value || 0).toLocaleString("en-PH", { style:"currency", currency:"PHP" });
    }
    function recordTotal(record) {
      return (record.items || []).reduce((total, item) => total + Number(item.qty || 0) * Number(item.price || 0), 0);
    }
    function setAdminState(nextSession) {
      session = nextSession;
      const loggedIn = Boolean(session);
      loginForm.hidden = loggedIn;
      adminUser.hidden = !loggedIn;
      logoutButton.hidden = !loggedIn;
      clearAllButton.hidden = !loggedIn;
      adminUser.textContent = loggedIn ? `Logged in as ${session.user.email}` : "";
      renderRecords();
    }
    function adminButton(label, className, attributes) {
      return `<button class="admin-button ${className || ""}" type="button" ${attributes}>${label}</button>`;
    }
    function editForm(record) {
      if (!session) return "";
      return `<form class="edit-form" data-record-id="${escapeHtml(record.id)}"><label>Project name<input name="project_name" value="${escapeHtml(record.project_name)}" required></label><label>Customer name<input name="customer_name" value="${escapeHtml(record.customer_name)}"></label><label>Quotation date<input name="quotation_date" type="date" value="${escapeHtml(record.quotation_date)}"></label><div class="record-actions"><button class="admin-button" type="submit">Save changes</button>${adminButton("Delete quotation","danger",`data-delete-id="${escapeHtml(record.id)}"`)}</div></form>`;
    }
    async function savePdf(pdf, record) {
      const filename = `${record.quotation_number || "quotation"}.pdf`;
      const blob = pdf.output("blob");
      if ("showSaveFilePicker" in window) {
        const handle = await window.showSaveFilePicker({ suggestedName:filename, types:[{ description:"PDF document", accept:{"application/pdf":[".pdf"]} }] });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return;
      }
      pdf.save(filename);
    }
    async function generateQuotationPdf(record) {
      if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("PDF export is unavailable.");
      const pdf = new window.jspdf.jsPDF({ unit:"mm", format:"a4" });
      const left = 16;
      let y = 18;
      const line = (text, size = 10, bold = false) => {
        pdf.setFont("helvetica", bold ? "bold" : "normal");
        pdf.setFontSize(size);
        pdf.text(String(text || ""), left, y);
        y += size * .55 + 3;
      };
      pdf.setFillColor(23, 35, 44);
      pdf.rect(0, 0, 210, 34, "F");
      pdf.setTextColor(255, 255, 255);
      line("PINOYPROTO 3D", 16, true);
      line("QUOTATION", 12, true);
      pdf.setTextColor(17, 17, 17);
      y = 45;
      line(`Quotation no.: ${record.quotation_number}`, 11, true);
      line(`Date: ${record.quotation_date || ""}`);
      line(`Customer: ${record.customer_name || ""}`);
      line(`Contact: ${record.contact || ""}`);
      line(`Address: ${record.address || ""}`);
      y += 3;
      line(`Project: ${record.project_name || ""}`, 12, true);
      line(`Bill to: ${record.bill_to || ""}`);
      line(`Ship to: ${record.ship_to || ""}`);
      y += 4;
      pdf.setFillColor(23, 35, 44);
      pdf.rect(left, y - 5, 178, 8, "F");
      pdf.setTextColor(255, 255, 255);
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(8);
      pdf.text("ITEM", left + 2, y);
      pdf.text("DESCRIPTION", left + 42, y);
      pdf.text("MATERIAL", left + 94, y);
      pdf.text("QTY", left + 132, y);
      pdf.text("UNIT PRICE", left + 150, y);
      y += 8;
      pdf.setTextColor(17, 17, 17);
      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(8);
      let total = 0;
      (record.items || []).forEach((item) => {
        const amount = Number(item.qty || 0) * Number(item.price || 0);
        total += amount;
        const values = [item.item, item.description, item.material, item.qty, money(item.price)];
        [left + 2, left + 42, left + 94, left + 132, left + 150].forEach((x, index) => pdf.text(String(values[index] || "").slice(0, 26), x, y));
        pdf.line(left, y + 2, left + 178, y + 2);
        y += 7;
      });
      pdf.setFont("helvetica", "bold");
      pdf.text(`GRAND TOTAL: ${money(total)}`, left + 112, y + 5);
      y += 18;
      line("Terms & Conditions", 11, true);
      (record.terms || []).forEach((term) => line(`${term.header}: ${term.details}`, 8));
      line("Payment Methods", 11, true);
      (record.payments || []).forEach((payment) => line(payment.name, 8));
      await savePdf(pdf, record);
    }
    function renderRecords() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = records.filter((record) => [record.quotation_number, record.project_name, record.customer_name]
        .some((value) => String(value || "").toLowerCase().includes(query)));
      if (!filtered.length) {
        recordsElement.innerHTML = `<div class="empty">${records.length ? "No quotations match your search." : "No saved quotations yet."}</div>`;
        return;
      }
      recordsElement.innerHTML = filtered.map((record) => {
        const items = (record.items || []).map((item) => `<tr><td>${escapeHtml(item.item)}</td><td>${escapeHtml(item.description)}</td><td>${escapeHtml(item.material)}</td><td>${escapeHtml(item.qty)}</td><td>${money(item.price)}</td></tr>`).join("");
        return `<details class="record"><summary><span class="record-number">${escapeHtml(record.quotation_number)}</span><strong>${escapeHtml(record.project_name)}</strong><span class="record-date">${escapeHtml(record.quotation_date || "No date")}</span><span class="record-total">${money(recordTotal(record))}</span></summary><div class="record-body"><div class="record-actions"><button class="pdf-button" type="button" data-pdf-id="${escapeHtml(record.id)}">Generate PDF</button></div>${editForm(record)}<div><h2>Customer</h2><p><strong>${escapeHtml(record.customer_name || "No customer name")}</strong></p><p>${escapeHtml(record.contact)}</p><p>${escapeHtml(record.address)}</p><h2>Project</h2><p>Bill to: ${escapeHtml(record.bill_to)}</p><p>Ship to: ${escapeHtml(record.ship_to)}</p></div><div><h2>Business information</h2><p>${escapeHtml(record.business_name)}</p><p>${escapeHtml(record.business_contact)}</p><p>${escapeHtml(record.business_email)}</p><h2>Last updated</h2><p>${escapeHtml(record.updated_at ? new Date(record.updated_at).toLocaleString() : "Not available")}</p></div><table class="items"><thead><tr><th>Item</th><th>Description</th><th>Material</th><th>Qty</th><th>Unit price</th></tr></thead><tbody>${items || "<tr><td colspan=\"5\">No items recorded.</td></tr>"}</tbody></table></div></details>`;
      }).join("");
    }
    async function updateRecord(form) {
      const recordId = form.dataset.recordId;
      const values = Object.fromEntries(new FormData(form));
      const { error } = await supabaseClient.from("quotations").update({
        project_name: values.project_name,
        customer_name: values.customer_name,
        quotation_date: values.quotation_date,
        updated_at: new Date().toISOString()
      }).eq("id", recordId);
      if (error) throw new Error(error.message);
      statusElement.textContent = "Quotation updated.";
      await loadRecords();
    }
    async function deleteRecord(recordId) {
      if (!window.confirm("Delete this quotation permanently?")) return;
      const { error } = await supabaseClient.from("quotations").delete().eq("id", recordId);
      if (error) throw new Error(error.message);
      await loadRecords();
    }
    async function clearAllRecords() {
      if (!window.confirm("Clear all saved quotations permanently?")) return;
      const { error } = await supabaseClient.from("quotations").delete().not("id", "is", null);
      if (error) throw new Error(error.message);
      await loadRecords();
    }
    async function loadRecords() {
      const response = await supabaseClient.from("quotations").select("*").order("created_at", { ascending:false });
      if (response.error) {
        statusElement.textContent = `Could not load saved quotations: ${response.error.message}`;
        statusElement.className = "status error";
        return;
      }
      records = response.data || [];
      statusElement.textContent = `${records.length} saved quotation${records.length === 1 ? "" : "s"}`;
      renderRecords();
    }
    searchInput.addEventListener("input", renderRecords);
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email: emailInput.value.trim(), password: passwordInput.value });
      if (error) {
        statusElement.textContent = `Login failed: ${error.message}`;
        statusElement.className = "status error";
        return;
      }
      passwordInput.value = "";
      setAdminState(data.session);
      statusElement.className = "status";
    });
    logoutButton.addEventListener("click", async () => {
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        statusElement.textContent = `Could not log out: ${error.message}`;
        statusElement.className = "status error";
        return;
      }
      setAdminState(null);
    });
    clearAllButton.addEventListener("click", async () => {
      try { await clearAllRecords(); } catch (error) { statusElement.textContent = `Could not clear quotations: ${error.message}`; statusElement.className = "status error"; }
    });
    recordsElement.addEventListener("submit", async (event) => {
      if (!event.target.matches(".edit-form")) return;
      event.preventDefault();
      try { await updateRecord(event.target); } catch (error) { statusElement.textContent = `Could not update quotation: ${error.message}`; statusElement.className = "status error"; }
    });
    recordsElement.addEventListener("click", async (event) => {
      const pdfButton = event.target.closest("[data-pdf-id]");
      if (pdfButton) {
        const record = records.find((item) => item.id === pdfButton.dataset.pdfId);
        if (!record) return;
        pdfButton.disabled = true;
        try {
          await generateQuotationPdf(record);
          statusElement.textContent = `PDF generated for ${record.quotation_number}.`;
        } catch (error) {
          statusElement.textContent = `Could not generate PDF: ${error.message}`;
          statusElement.className = "status error";
        } finally {
          pdfButton.disabled = false;
        }
        return;
      }
      const deleteButton = event.target.closest("[data-delete-id]");
      if (!deleteButton) return;
      try { await deleteRecord(deleteButton.dataset.deleteId); } catch (error) { statusElement.textContent = `Could not delete quotation: ${error.message}`; statusElement.className = "status error"; }
    });
    supabaseClient.auth.getSession().then(({ data }) => setAdminState(data.session));
    loadRecords();
  </script>
</body>
</html>
